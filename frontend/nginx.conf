server {
    listen 80;
    server_name localhost;

    # Root directory where the production build static assets are located
    root /usr/share/nginx/html;
    index index.html;

    # Handle SPA routing (redirect all non-file/directory requests to index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy all API requests to the backend service running inside the docker-compose network
    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Optimize timeouts for API proxying
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Define custom error page
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
